name: test

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - codex/m6/combo-*

permissions:
  contents: read

jobs:
  lock-validation:
    uses: ./.github/workflows/lock-validation.yml
    with:
      source-sha: ${{ github.workflow_sha }}
      workflow-path: .github/workflows/test.yml

  go-test:
    needs: lock-validation
    if: needs.lock-validation.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: make test

  integration-stub:
    needs: lock-validation
    if: needs.lock-validation.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Install Ruby
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ruby ruby-webrick
          ruby --version
      - run: make build
      - run: make test-stub

  integration-live:
    needs: lock-validation
    if: needs.lock-validation.result == 'success'
    runs-on: ubuntu-latest
    # Separate job so flakes don't block merge
    continue-on-error: true
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Install Ruby
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ruby ruby-webrick
          ruby --version
      - run: make build
      - run: make test-integration
