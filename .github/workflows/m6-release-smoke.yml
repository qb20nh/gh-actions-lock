name: M6 release asset smoke

on:
  push:
    branches:
      - codex/m6/evidence-*
    paths:
      - .github/workflows/m6-release-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-validation:
    uses: ./.github/workflows/lock-validation.yml
    with:
      source-sha: ${{ github.workflow_sha }}
      workflow-path: .github/workflows/m6-release-smoke.yml

  release-asset:
    name: Verify uploaded Linux binary
    needs: lock-validation
    if: needs.lock-validation.result == 'success' && github.repository == 'qb20nh/gh-actions-lock' && startsWith(github.ref, 'refs/heads/codex/m6/evidence-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      M6_TESTED_SHA: a23bb9b0d13aad17565ca53d8436f6959acaff6b
      M6_TAG: m6-a23bb9b0d13aad17565ca53d8436f6959acaff6b
      M6_RELEASE_ID: 409048665
      M6_ASSET_SHA256: 444d2a528175d660619d1d2b77f688ef6243042ccff6f329ac720fbd59de2cd1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify candidate tag and download draft asset
        shell: bash
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/${M6_TAG}")" = tag
          test "$(git rev-parse "${M6_TAG}^{commit}")" = "$M6_TESTED_SHA"
          gh release view "$M6_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
            --jq '.isDraft and .isPrerelease' | jq -e 'select(. == true)' > /dev/null
          mkdir -p "$RUNNER_TEMP/m6-release"
          gh release download "$M6_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern linux-amd64 --dir "$RUNNER_TEMP/m6-release"
          # GitHub's release-by-tag endpoint omits drafts; address this draft by ID.
          m6_api_digest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${M6_RELEASE_ID}" \
            --jq '.assets[] | select(.name == "linux-amd64") | .digest')"
          test "$m6_api_digest" = "sha256:${M6_ASSET_SHA256}"
          printf '%s  %s\n' "$M6_ASSET_SHA256" "$RUNNER_TEMP/m6-release/linux-amd64" | sha256sum --check
      - name: Verify build attestation and source commit
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "$RUNNER_TEMP/m6-release/linux-amd64" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow qb20nh/gh-actions-lock/.github/workflows/m6-validation.yml \
            --source-digest "$M6_TESTED_SHA" --deny-self-hosted-runners
      - name: Execute the released binary and verify workflow coverage
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/m6-release/linux-amd64"
          "$RUNNER_TEMP/m6-release/linux-amd64" --version
          "$RUNNER_TEMP/m6-release/linux-amd64" --help > /dev/null
          "$RUNNER_TEMP/m6-release/linux-amd64" --require-lockfile --verify-frozen --json=valid,findings \
            > "$RUNNER_TEMP/m6-release/verification.json"
          jq -e '.valid == true' "$RUNNER_TEMP/m6-release/verification.json"
      - name: Confirm released verifier rejects a missing lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m6-missing-lock/.github/workflows"
          cd "$RUNNER_TEMP/m6-missing-lock"
          git init -q
          printf 'name: Missing lock control\non: push\njobs:\n  shell:\n    runs-on: ubuntu-latest\n    steps:\n      - run: true\n' \
            > .github/workflows/shell.yml
          if "$RUNNER_TEMP/m6-release/linux-amd64" --require-lockfile --verify-local; then
            echo 'error: released verifier accepted a missing lock' >&2
            exit 1
          fi
      - name: Attach runtime evidence to draft notes
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$M6_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
            --jq '.isDraft and .isPrerelease' | jq -e 'select(. == true)' > /dev/null
          cp test/runtime/evidence/2026-10-11-combo.md "$RUNNER_TEMP/m6-release/notes.md"
          {
            printf '\n## Uploaded binary verification\n\n'
            printf '[Release asset smoke](%s/%s/actions/runs/%s) verified the Linux amd64 digest, build attestation, source commit, frozen graph, and missing-lock rejection.\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } >> "$RUNNER_TEMP/m6-release/notes.md"
          gh release edit "$M6_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/m6-release/notes.md"
          {
            printf '### M6 uploaded binary verification\n\n'
            printf 'Tested source commit: `%s`\n\n' "$M6_TESTED_SHA"
            printf 'Asset digest: `sha256:%s`\n\n' "$M6_ASSET_SHA256"
            printf 'Passed: digest, attestation, source binding, binary execution, frozen graph, and missing-lock rejection.\n\n'
            printf 'M6 remains blocked on upstream #125: malformed lock YAML was ignored at runtime.\n'
          } >> "$GITHUB_STEP_SUMMARY"
