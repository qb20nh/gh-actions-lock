name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lock-validation:
    uses: ./.github/workflows/lock-validation.yml
    with:
      source-sha: ${{ github.workflow_sha }}
      workflow-path: .github/workflows/release.yml

  publish:
    name: Publish
    needs: lock-validation
    if: needs.lock-validation.result == 'success'
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag
        run: script/verify-release-tag "$GITHUB_REF_NAME" v

      - uses: $/.github/actions/gh-extension-precompile
        with:
          generate_attestations: true
          go_version_file: go.mod
          go_build_options: ./cmd/gh-actions-lock
